name: TeamRoom
options:
  bundleIdPrefix: com.kewz
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "9"
targets:
  TeamRoom:
    type: application
    platform: iOS
    sources:
      - TeamRoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kewz.teamroom
        PRODUCT_NAME: TeamRoom
        GENERATE_INFOPLIST_FILE: YES
        # Base plist for keys build settings cannot express (teamroom:// links from Bark notifications).
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Team Room
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        SWIFT_EMIT_LOC_STRINGS: NO
        SUPPORTS_MACCATALYST: NO
  TeamRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TeamRoom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TeamRoomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TeamRoom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TeamRoom:
    build:
      targets:
        TeamRoom: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TeamRoomTests
        - TeamRoomUITests
    archive:
      config: Release
