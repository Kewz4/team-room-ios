name: Build unsigned IPA

on:
  push:
    branches: [main, 'v*']
  workflow_dispatch:
    inputs:
      only_testing:
        description: 'Run only these tests (comma separated, e.g. TeamRoomUITests/TeamRoomUITests/testX); empty runs all'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  ipa:
    name: Build TeamRoom.ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select stable iOS 26 Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=/Applications/Xcode_26.5.app
          if [ ! -d "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcodebuild -runFirstLaunch
          killall XCBBuildService 2>/dev/null || true
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # 1.3: the app is built and uploaded before the tests, so a failing UI test never holds back the installable IPA.
      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project TeamRoom.xcodeproj \
            -scheme TeamRoom \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 250

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/TeamRoom.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry TeamRoom-unsigned.ipa Payload
          ls -la TeamRoom-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: TeamRoom-unsigned-ipa
          path: ${{ runner.temp }}/TeamRoom-unsigned.ipa
          if-no-files-found: error

      - name: Use the on-screen keyboard in the simulator
        # 1.2: the notes and composer tests check the real keyboard, which a connected hardware keyboard hides.
        # 1.3: build 14 replaced this with booting the simulator before the tests, and from then on agent rooms opened
        # without their messages in the UI tests. Bisect 2026-10-24: build 14's code passes with build 12's setup (this one).
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

      - name: Unit, UI, screenshot and performance tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; rows=[v for k in sorted(d,reverse=True) if "iOS-" in k for v in d[k] if v.get("isAvailable") and v["name"].startswith("iPhone")]; print(rows[0]["udid"] if rows else "")')
          test -n "$DEVICE"
          ONLY=""
          for t in $(echo "${{ inputs.only_testing }}" | tr ',' ' '); do ONLY="$ONLY -only-testing:$t"; done
          xcodebuild test -project TeamRoom.xcodeproj -scheme TeamRoom $ONLY \
            -jobs 1 \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/TeamRoomTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/test.log" | tail -n 160

      - name: Export UI screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/qa"
          if [ -d "$RUNNER_TEMP/TeamRoomTests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/TeamRoomTests.xcresult" --output-path "$RUNNER_TEMP/qa"
          fi
          cp "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/qa/" 2>/dev/null || true
          # Performance numbers (clock, memory, scroll hitches, launch) for the QA report.
          grep -E "measured \[|Test Case .*(passed|failed)" "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/qa/results-and-metrics.txt" 2>/dev/null || true
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name '*BuildService*' -exec cp {} "$RUNNER_TEMP/qa/" \; 2>/dev/null || true

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TeamRoom-qa
          path: ${{ runner.temp }}/qa
          if-no-files-found: warn
